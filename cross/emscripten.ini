# Emscripten cross-compilation file for opcodec WASM browser client.
#
# Usage:
#   meson setup buildwasm \
#     --cross-file subprojects/opcodec/cross/emscripten.ini \
#     -Dwasm_client=true \
#     subprojects/opcodec
#
# Requires emcc ≥ 3.1 in PATH.
# Output: buildwasm/opcodec_wasm.js + opcodec_wasm.wasm

[binaries]
c        = 'emcc'
cpp      = 'em++'
ar       = 'emar'
strip    = 'emstrip'
pkgconfig = 'pkg-config'

[built-in options]
# -flto disabled for WASM: Emscripten does its own LTO via wasm-opt
c_args    = ['-O2', '-fno-exceptions', '-DOPCODEC_WASM=1']
c_link_args = [
  '-O2',
  '-sEXPORTED_RUNTIME_METHODS=["cwrap","getValue","setValue","HEAPU8","HEAPF32"]',
  '-sALLOW_MEMORY_GROWTH=1',
  '-sMODULARIZE=1',
  '-sEXPORT_NAME=createOpcodec',
  '-sINITIAL_MEMORY=33554432',
  '--no-entry',
]

[properties]
needs_exe_wrapper = true

[host_machine]
system     = 'emscripten'
cpu_family = 'wasm32'
cpu        = 'wasm32'
endian     = 'little'
